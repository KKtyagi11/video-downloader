name: Android

# Builds an installable debug APK. GitHub's runners already have the JDK and
# Android SDK, so no local Android Studio is needed. Run it from the Actions tab
# and download the APK from the run's artifacts; tagging v*-android also attaches
# it to a release.

on:
  push:
    tags:
      - 'v*-android'
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: List outputs
        shell: bash
        working-directory: android
        run: find app/build/outputs -name '*.apk' -exec ls -lh {} \;

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        working-directory: android
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "$TAG" --generate-notes
          find app/build/outputs/apk/debug -name '*.apk' -print0 \
            | xargs -0 -I{} gh release upload "$TAG" "{}" --clobber
